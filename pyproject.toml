[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouster-demo"
version = "0.1.0"
description = "General Autonomy x Ouster lidar: live point cloud streaming with real-time classical AV perception"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ouster-sdk==1.0.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.25"]

[project.scripts]
ouster-demo = "ouster_demo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ouster_demo = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
